# Backend deployment for Render.
#
# The frontend is a static build and goes to Vercel (see vercel.json); this is
# the Node service it talks to. Render is used for the backend specifically
# because /api/realtime is a long-lived WebSocket carrying the voice session,
# which serverless functions cannot hold open.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Every `sync: false` key below is prompted for at deploy time and never
# committed.

services:
  - type: web
    name: excalidraw-web-mcp-server
    runtime: node
    rootDir: server
    # Free spins the service down after ~15 minutes idle, and the next request
    # then waits through a cold start. Fine while developing; switch to
    # `starter` before anyone else is relying on it being up.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Origin allowed through CORS. Set this to the deployed frontend URL —
      # left unset, the API is open to any origin.
      - key: FRONTEND_ORIGIN
        sync: false

      - key: LLM_PROVIDER
        value: azure

      # ---- Azure OpenAI: chat ----
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-4.1
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-10-21"

      # ---- Azure OpenAI: live voice agent ----
      # Reuses the endpoint and key above.
      - key: AZURE_OPENAI_REALTIME_DEPLOYMENT
        value: gpt-realtime-2
      - key: AZURE_OPENAI_REALTIME_API_VERSION
        value: "2025-04-01-preview"
      - key: AZURE_OPENAI_REALTIME_VOICE
        value: alloy

      # Model the voice agent delegates hard reasoning to via its `think` tool.
      - key: AZURE_OPENAI_THINK_DEPLOYMENT
        value: gpt-5.6-sol
